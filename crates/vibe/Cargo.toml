[package]
name = "vibe"
version = "0.1.3"
description = "The platform program (ADR 0015)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
authz = { path = "../authz" }
openworkers-core.workspace = true
openworkers-runtime-v8.workspace = true

bytes.workspace = true
clap.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
fallible-iterator.workspace = true
getrandom.workspace = true
pg_query.workspace = true
postgres-protocol.workspace = true
sha2.workspace = true
tokio-postgres.workspace = true
tokio.workspace = true
uuid.workspace = true
rustix.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
# The certificate the program serves itself: its names and dates
# (src/own_tls.rs).
x509-parser.workspace = true
# OIDC sign-in (src/oidc): ID tokens' RS256 and ES256 signatures, the
# refresh token sealed at rest (AES-256-GCM, HKDF), randomness; base64url
# for JWS and JWKS; the issuer's and the endpoints' URLs and their query
# strings. All three already in the tree through rustls and the harness.
ring.workspace = true
base64.workspace = true
url.workspace = true
zip.workspace = true
liblzma.workspace = true
tar.workspace = true

[build-dependencies]
flate2.workspace = true
serde_json.workspace = true
tar.workspace = true

[dev-dependencies]
# Only for the harness's private Postgres, which the platform database's own
# tests run against (src/platform_db). `blackbox` depends on no product
# crate, so this is no cycle and gives it no way in.
blackbox = { path = "../../blackbox" }

[lints]
workspace = true

[package]
name = "vm"
version = "0.0.0"
description = "The platform program (ADR 0015)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vm"
path = "src/main.rs"

[dependencies]
authz = { path = "../authz" }
openworkers-core.workspace = true
openworkers-runtime-v8.workspace = true

bytes.workspace = true
clap.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
fallible-iterator.workspace = true
pg_query.workspace = true
postgres-protocol.workspace = true
sha2.workspace = true
tokio-postgres.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
# Only for the harness's private Postgres, which the platform database's own
# tests run against (src/platform_db). `blackbox` depends on no product
# crate, so this is no cycle and gives it no way in.
blackbox = { path = "../../blackbox" }

[lints]
workspace = true

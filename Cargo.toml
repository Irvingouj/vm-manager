[workspace]
resolver = "3"
members = ["crates/*", "blackbox"]
# The vendored runtime is a workspace of its own: not ours to restyle, and not
# held to our lints (vendor/VENDORED.md).
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# The execution core (ADR 0002): openworkers-core at a pinned tag, and
# openworkers-runtime-v8 at a pinned tag, replaced by the patched copy in
# vendor/ (see [patch] below and vendor/VENDORED.md).
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.18.1", features = ["invoke"] }
openworkers-runtime-v8 = { git = "https://github.com/openworkers/openworkers-runtime-v8", tag = "v0.18.7", features = ["invoke"] }

bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
# The client side is the tool's (crates/vibe/src/tool): plain HTTP/1.1 to the
# installation, driven on the tool's own single thread.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The operating system's randomness, for tool credentials. Already in the
# tree through uuid.
getrandom = "0.4"
# The platform database (ADR 0015): the protocol-level client, so that later
# tickets can send one statement over the extended protocol, cancel a
# request, and keep a pool per database and Access level.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# The statement without its values (blackbox/CONTRACT.md, "The Operation
# log"): Postgres's own scanner and parser, so that what counts as a constant
# is what Postgres counts. It builds C with bindgen, which needs libclang
# (README.md, "Build and test").
pg_query = "18.1.0"
# The Database executor's own client for shared databases: message encoding,
# decoding and SCRAM, from the same crate tokio-postgres is built on.
postgres-protocol = "0.6"
# How postgres-protocol hands over the fields of a message.
fallible-iterator = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time", "io-util", "process", "signal"] }
# Stopping a whole process group (`vibe check` runs each of the project's
# tools in a group of its own), behind a safe interface; and `fs`, to tell
# whether standard output was closed when the tool started (`vibe logs
# --follow`).
rustix = { version = "1", default-features = false, features = ["std", "process", "fs", "system"] }
# The SDK's tarball that `vibe new` writes, made by crates/vibe/build.rs.
tar = { version = "0.4", default-features = false }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
# The local run's download of Postgres (crates/vibe/src/tool/local/download.rs):
# TLS in Rust, with ring's cryptography and Mozilla's roots compiled in (no
# system library, no certificate store read), driven by tokio under hyper's
# client; and the archive unpacked: a jar (zip, deflate) holding a tar
# compressed with xz. The same crates the harness uses (blackbox).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
liblzma = { version = "0.4", default-features = false, features = ["static"] }
# The black-box harness's own OIDC identity provider (blackbox/src/oidc.rs):
# RS256 and ES256 signatures and HS256 for a forged token, with the
# randomness of the operating system (ring, already in the tree through
# rustls); base64url for the JWS and the JWKS; and URLs and their query
# strings read and written as a browser does.
ring = "0.17"
base64 = "0.22"
url = "2"
# The program serving TLS itself (crates/vibe/src/own_tls.rs): the
# certificate's DNS names (subject alternative names) and its validity, read
# from its DER. rustls and rustls-webpki do not expose them. Already in the
# tree at this version through rcgen (the harness's certificates); no
# feature of it is used (no verification: rustls does that).
x509-parser = { version = "0.18", default-features = false }

# Lints are set here once; every crate of ours inherits them with
# `[lints] workspace = true`. See "Rust rules" in AGENTS.md, and clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# No panic on the serving path (tests are allowed these through clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
mem_forget = "deny"
exit = "deny"
# No lock held across an await.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
# Minimize clone; a cheap Arc clone reads as Arc::clone(&x).
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
needless_pass_by_value = "deny"
# No `as` cast that can truncate or change sign.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# The lists in clippy.toml: no unbounded channel.
disallowed_methods = "deny"
disallowed_types = "deny"
# An exception says why.
allow_attributes_without_reason = "deny"

# Debug builds carry line numbers for our own crates (a panic's backtrace
# still names the line) and no debug information for dependencies. The gate
# links some 190 test binaries; with full debug information `target/debug`
# passed 34 GB and filled the disk of the machine that runs the gate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"

[patch."https://github.com/openworkers/openworkers-runtime-v8"]
openworkers-runtime-v8 = { path = "vendor/openworkers-runtime-v8" }

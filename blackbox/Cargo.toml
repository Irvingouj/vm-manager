[package]
name = "blackbox"
version = "0.0.0"
description = "Black-box tests of the vibe program, from outside (AGENTS.md: How code gets written)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# This crate must depend on no product crate (CI checks it): it reaches the
# program only by starting the real `vibe` binary and talking to it.
[dependencies]
# To read the program's JSON log records and the fixtures' JSON answers.
serde_json = "1"
# The harness's private Postgres (CONTRACT.md, "How the tests get a
# Postgres"): fetching zonky's prebuilt binaries from Maven Central once,
# checking them against the published SHA-256, and unpacking them (a jar,
# which is a zip, holding a .tar.xz).
ureq = "3"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
liblzma = { version = "0.4", default-features = false, features = ["static"] }
tar = { version = "0.4", default-features = false }
# The release's tool archives are gzip'd tars (CONTRACT.md, "The first
# release"): read entry by entry with `tar` above and flate2's pure-Rust
# gzip (already in the lock file through `zip`).
flate2 = "1"
# To set up the shared databases the tests register as Resources, and to
# look at them from outside the program: a client of the harness's own,
# never the program's.
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }
tokio-postgres = "0.7"
# The harness's identity provider and browser (src/oidc.rs, src/browser.rs):
# signing ID tokens, base64url, and URLs with their query strings.
ring.workspace = true
base64.workspace = true
url.workspace = true
# The harness's TLS fronts and client (src/tls.rs): an installation and an
# identity provider behind TLS under test authorities the harness makes per
# test (rcgen, with ring's cryptography: no system library), terminated by
# rustls (the same crates, with the same features, as the workspace's).
rustls.workspace = true
tokio-rustls.workspace = true
# What the tests of Storage look at on the host's directory themselves
# (CONTRACT.md, "Storage: What is on the directory"): a file's extended
# attribute `user.vibe.content-type`, and a FIFO planted. The workspace's
# rustix, safe Rust.
rustix.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
# The release workflow is read as YAML, not grepped (CONTRACT.md, "The first
# release: The workflow"): a maintained YAML 1.2 parser, in which `on` is a
# key and not a boolean.
yaml-rust2 = { version = "0.13", default-features = false }

[lints]
workspace = true

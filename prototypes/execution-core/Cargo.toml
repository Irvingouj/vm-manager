[workspace]
resolver = "3"
members = ["host"]
# The vendored crates are workspace roots of their own.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
# Fast enough to build in CI, small enough to ship.
strip = "debuginfo"

# Patched upstream crates; see vendor/VENDORED.md.
[patch."https://github.com/openworkers/openworkers-runtime-v8"]
openworkers-runtime-v8 = { path = "vendor/openworkers-runtime-v8" }
